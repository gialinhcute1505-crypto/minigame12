<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>T-Rex Dino Runner Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #f7f7f7;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background-color 1s ease, color 1s ease;
    }

    /* Chế độ đêm */
    body.night-mode {
      background-color: #1a1a1a;
      color: #f7f7f7;
    }

    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 800px;
      padding: 10px;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .score-board {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      background-color: #ffffff;
      border: 2px solid #535353;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: background-color 1s ease, border-color 1s ease;
    }

    body.night-mode .canvas-container {
      background-color: #222222;
      border-color: #888888;
      box-shadow: 0 10px 20px rgba(255,255,255,0.05);
    }

    canvas {
      display: block;
      width: 100%;
      height: 250px;
    }

    .controls-hint {
      display: flex;
      gap: 15px;
      font-size: 13px;
      opacity: 0.8;
      flex-wrap: wrap;
      justify-content: center;
    }

    .key {
      background: #e0e0e0;
      color: #333;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      border: 1px solid #ccc;
    }

    body.night-mode .key {
      background: #444;
      color: #fff;
      border-color: #666;
    }

    /* Đèn nền mobile controls */
    .mobile-controls {
      display: none;
      width: 100%;
      gap: 10px;
      margin-top: 5px;
    }

    @media (max-width: 768px) {
      .mobile-controls {
        display: flex;
      }
    }

    .btn-action {
      flex: 1;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      background: #535353;
      color: white;
      border: none;
      border-radius: 6px;
      touch-action: manipulation;
    }

    .btn-action:active {
      background: #333;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="header">
      <div class="title">🦖 T-REX RUNNER</div>
      <div class="score-board">
        HI <span id="highScore">00000</span> | <span id="currentScore">00000</span>
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas" width="800" height="250"></canvas>
    </div>

    <div class="controls-hint">
      <span><span class="key">Space</span> / <span class="key">▲</span> Nhảy</span>
      <span><span class="key">▼</span> Cúi người</span>
      <span><span class="key">R</span> Chơi lại</span>
    </div>

    <div class="mobile-controls">
      <button class="btn-action" id="btnJump">NHẢY (JUMP)</button>
      <button class="btn-action" id="btnDuck">CÚI (DUCK)</button>
    </div>
  </div>

  <script>
    // --- AM THANH NGUYEN BAN (WEB AUDIO API) ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playJump() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }

      playScore() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'square';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.08); // A5

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);

        osc.start(now);
        osc.stop(now + 0.25);
      }

      playHit() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.25);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }
    }

    const sound = new SoundEffects();

    // --- GAME ENGINE & SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const highScoreEl = document.getElementById('highScore');
    const currentScoreEl = document.getElementById('currentScore');

    const GAME_SPEED_START = 6;
    const GRAVITY = 0.6;
    const GROUND_Y = 210;

    let gameSpeed = GAME_SPEED_START;
    let score = 0;
    let highScore = localStorage.getItem('dinoHighScore') || 0;
    let isGameOver = false;
    let gameFrame = 0;
    let isNight = false;

    highScoreEl.innerText = String(highScore).padStart(5, '0');

    // --- KHỦNG LONG (DINO) ---
    const dino = {
      x: 50,
      y: GROUND_Y - 44,
      width: 40,
      height: 44,
      vy: 0,
      isJumping: false,
      isDucking: false,
      legFrame: 0,

      jump() {
        if (!this.isJumping) {
          this.vy = -12;
          this.isJumping = true;
          this.isDucking = false;
          sound.playJump();
          createParticles(this.x + 10, GROUND_Y, 8);
        }
      },

      duck(ducking) {
        if (this.isJumping) return;
        this.isDucking = ducking;
        if (ducking) {
          this.height = 26;
          this.y = GROUND_Y - 26;
        } else {
          this.height = 44;
          this.y = GROUND_Y - 44;
        }
      },

      update() {
        // Nhảy & Trọng lực
        if (this.isJumping) {
          this.y += this.vy;
          this.vy += GRAVITY;

          if (this.y >= GROUND_Y - this.height) {
            this.y = GROUND_Y - this.height;
            this.isJumping = false;
            this.vy = 0;
            createParticles(this.x + 10, GROUND_Y, 5);
          }
        }

        //
