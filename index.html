<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>T-Rex Dino Runner Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-wrapper">
    <div class="header">
      <div class="title">🦖 T-REX RUNNER</div>
      <div class="score-board">
        HI <span id="highScore">00000</span> | <span id="currentScore">00000</span>
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas" width="800" height="250"></canvas>
    </div>

    <div class="controls-hint">
      <span><span class="key">Space</span> / <span class="key">▲</span> Nhảy</span>
      <span><span class="key">▼</span> Cúi người</span>
      <span><span class="key">R</span> Chơi lại</span>
    </div>

    <div class="mobile-controls">
      <button class="btn-action" id="btnJump">NHẢY (JUMP)</button>
      <button class="btn-action" id="btnDuck">CÚI (DUCK)</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
